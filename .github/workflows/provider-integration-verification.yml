name: Provider Integration Verification

on:
  workflow_dispatch:

jobs:
  provider-verification:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          INSULACRM_API_BASE_URL: ${{ secrets.INSULACRM_API_BASE_URL }}
          INSULACRM_API_TOKEN: ${{ secrets.INSULACRM_API_TOKEN }}
          CANONICAL_PLATFORM_WEBHOOK_PATH: ${{ vars.CANONICAL_PLATFORM_WEBHOOK_PATH || '/webhook/canonical-platform-integration-hardening' }}
          CANONICAL_LIFECYCLE_HANDOFF_WEBHOOK_PATH: ${{ vars.CANONICAL_LIFECYCLE_HANDOFF_WEBHOOK_PATH || '/webhook/canonical-lifecycle-handoff' }}
          PLATFORM_EVENT_ROUTER_WEBHOOK_PATH: ${{ vars.PLATFORM_EVENT_ROUTER_WEBHOOK_PATH || '/webhook/platform-event-router' }}
          PROVIDER_ADAPTER_WEBHOOK_PATH: ${{ vars.PROVIDER_ADAPTER_WEBHOOK_PATH || '/webhook/canonical-provider-adapter' }}
          PROVIDER_CALLBACK_WEBHOOK_PATH: ${{ vars.PROVIDER_CALLBACK_WEBHOOK_PATH || '/webhook/canonical-provider-callback' }}
          PROVIDER_CONTRACT_DRY_RUN: ${{ vars.PROVIDER_CONTRACT_DRY_RUN || 'true' }}
          PROVIDER_CALLBACK_SHARED_TOKEN: ${{ secrets.PROVIDER_CALLBACK_SHARED_TOKEN }}
        run: node scripts/verify-deployment-configuration.js
      - name: Validate deployment and provider configuration
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          INSULACRM_API_BASE_URL: ${{ secrets.INSULACRM_API_BASE_URL }}
          COMMUNICATIONS_PROVIDER: ${{ secrets.COMMUNICATIONS_PROVIDER }}
          COMMUNICATIONS_API_BASE_URL: ${{ secrets.COMMUNICATIONS_API_BASE_URL }}
          COMMUNICATIONS_API_TOKEN: ${{ secrets.COMMUNICATIONS_API_TOKEN }}
          ESIGNATURE_PROVIDER: ${{ secrets.ESIGNATURE_PROVIDER }}
          ESIGNATURE_API_BASE_URL: ${{ secrets.ESIGNATURE_API_BASE_URL }}
          ESIGNATURE_API_TOKEN: ${{ secrets.ESIGNATURE_API_TOKEN }}
          TITLE_CLOSING_PROVIDER: ${{ secrets.TITLE_CLOSING_PROVIDER }}
          TITLE_CLOSING_API_BASE_URL: ${{ secrets.TITLE_CLOSING_API_BASE_URL }}
          TITLE_CLOSING_API_TOKEN: ${{ secrets.TITLE_CLOSING_API_TOKEN }}
          FUNDS_PROVIDER: ${{ secrets.FUNDS_PROVIDER }}
          FUNDS_API_BASE_URL: ${{ secrets.FUNDS_API_BASE_URL }}
          FUNDS_API_TOKEN: ${{ secrets.FUNDS_API_TOKEN }}
        run: node scripts/verify-provider-configuration.js
      - name: Run provider adapter dry-run matrix
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          PROVIDER_ADAPTER_WEBHOOK_PATH: ${{ vars.PROVIDER_ADAPTER_WEBHOOK_PATH || '/webhook/canonical-provider-adapter' }}
        run: node scripts/run-provider-adapter-matrix.js
      - name: Run live provider contract tests
        if: ${{ vars.PROVIDER_CONTRACT_DRY_RUN == 'false' }}
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          PROVIDER_ADAPTER_WEBHOOK_PATH: ${{ vars.PROVIDER_ADAPTER_WEBHOOK_PATH || '/webhook/canonical-provider-adapter' }}
          PROVIDER_CONTRACT_DRY_RUN: 'false'
          PROVIDER_CALLBACK_SHARED_TOKEN: ${{ secrets.PROVIDER_CALLBACK_SHARED_TOKEN }}
        run: node scripts/run-provider-contract-tests.js
      - name: Verify provider resource endpoint
        if: ${{ secrets.PROVIDER_RESOURCE_TEST_ID != '' }}
        env:
          INSULACRM_API_BASE_URL: ${{ secrets.INSULACRM_API_BASE_URL }}
          INSULACRM_API_TOKEN: ${{ secrets.INSULACRM_API_TOKEN }}
          PROVIDER_RESOURCE_TEST_CATEGORY: ${{ vars.PROVIDER_RESOURCE_TEST_CATEGORY || 'esignature' }}
          PROVIDER_RESOURCE_TEST_ID: ${{ secrets.PROVIDER_RESOURCE_TEST_ID }}
          PROVIDER_RESOURCE_TEST_DEAL_ID: ${{ vars.PROVIDER_RESOURCE_TEST_DEAL_ID || 'provider-resource-verification-deal' }}
        run: node scripts/verify-provider-resource-endpoint.js
      - name: Run controlled live provider lifecycle E2E
        if: ${{ vars.PROVIDER_LIFECYCLE_E2E_ENABLED == 'true' }}
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          PROVIDER_ADAPTER_WEBHOOK_PATH: ${{ vars.PROVIDER_ADAPTER_WEBHOOK_PATH || '/webhook/canonical-provider-adapter' }}
          PROVIDER_CALLBACK_WEBHOOK_PATH: ${{ vars.PROVIDER_CALLBACK_WEBHOOK_PATH || '/webhook/canonical-provider-callback' }}
          PROVIDER_CALLBACK_SHARED_TOKEN: ${{ secrets.PROVIDER_CALLBACK_SHARED_TOKEN }}
          PROVIDER_LIFECYCLE_CATEGORY: ${{ vars.PROVIDER_LIFECYCLE_CATEGORY || 'esignature' }}
          PROVIDER_LIFECYCLE_OPERATION: ${{ vars.PROVIDER_LIFECYCLE_OPERATION || 'create_package' }}
          PROVIDER_LIFECYCLE_DEAL_ID: ${{ vars.PROVIDER_LIFECYCLE_DEAL_ID || 'provider-lifecycle-e2e-deal' }}
          PROVIDER_LIFECYCLE_PROPERTY_ID: ${{ vars.PROVIDER_LIFECYCLE_PROPERTY_ID || 'provider-lifecycle-e2e-property' }}
        run: node scripts/run-provider-lifecycle-e2e.js
      - name: Run provider callback contract tests
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          PROVIDER_CALLBACK_WEBHOOK_PATH: ${{ vars.PROVIDER_CALLBACK_WEBHOOK_PATH || '/webhook/canonical-provider-callback' }}
          PROVIDER_CALLBACK_SHARED_TOKEN: ${{ secrets.PROVIDER_CALLBACK_SHARED_TOKEN }}
        run: node scripts/run-provider-callback-contract-tests.js
      - name: Run provider adapter healthchecks
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          PROVIDER_ADAPTER_WEBHOOK_PATH: ${{ vars.PROVIDER_ADAPTER_WEBHOOK_PATH || '/webhook/canonical-provider-adapter' }}
        run: node scripts/run-provider-integration-verification.js
